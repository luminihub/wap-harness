schema_version: "1.0"

extension:
  id: harness
  name: "wap-harness — automated validators"
  version: "0.1.0"
  description: "Runs a config-driven gate (contract, build, lint, test+coverage) automatically after implement, and reports pass/fail. No autonomous loop — red returns to human decision."
  author: WAP/WAAW
  license: MIT

requires:
  # adjust to the spec-kit version in use (see build plan, Fase 0)
  speckit_version: ">=0.2.0"

provides:
  commands:
    - name: speckit.harness.gate
      file: commands/speckit.harness.gate.md
      description: "Run the gate for the current work and report pass/fail"
    - name: speckit.harness.setup
      file: commands/speckit.harness.setup.md
      description: "Write harness.config.yml for the project's stack and seed harness files"
    - name: speckit.harness.patterns
      file: commands/speckit.harness.patterns.md
      description: "Extract code patterns from the project's own implemented code into docs/patterns.md"

  config:
    - name: "harness.config.yml"
      template: "config-template.yml"
      description: "The four sensor slots + coverage source; specialized per stack by /harness-setup"
      required: false

hooks:
  after_implement:
    command: speckit.harness.gate
    optional: false
    description: "Run the gate automatically after implementation"

tags:
  - "gate"
  - "validation"
  - "harness"

config:
  defaults:
    coverage_min: 80
